# Invisible Aligners — nginx server block for the static export (dist-static/)
# Default paths work inside the included Docker container; edit `root` and
# `server_name` for a bare VPS install.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prerendered routes -> HTML; everything else falls back to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# For HTTPS on a private server, wrap the block above in a
# `server { listen 443 ssl; ... }` with your certificate and add:
#   return 301 https://$host$request_uri;